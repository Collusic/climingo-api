name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # -----------------------------------
  # 1) CI
  # -----------------------------------
  ci_job:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - run: ./gradlew test

      - uses: actions/upload-artifact@v4
        with:
          name: packaged-jar
          path: build/libs/*.jar

  # -----------------------------------
  # 2) DEV 배포
  # -----------------------------------
  deploy_dev_job:
    needs: ci_job
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    concurrency:
      group: deploy-dev
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: packaged-jar
          path: build/libs

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set env
        run: |
          echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILDTIME=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Build & Push Dev Image
        run: |
          docker build -t climingo/climingo-dev:${{ github.sha }} .
          docker push climingo/climingo-dev:${{ github.sha }}

      - uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Deploy to Dev Server
        run: |
          ssh -o StrictHostKeyChecking=no singco@${{ secrets.DEV_HOST }} "
            set -e
            export PATH='/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin':\$PATH
            cd '${{ secrets.DEV_DOCKER_COMPOSE_PATH }}'
            export TAG='${{ github.sha }}'
            export JASYPT_PASSWORD='${{ secrets.JASYPT_PASSWORD }}'
            export BUILDTIME='$BUILDTIME'
            docker pull climingo/climingo-dev:${{ github.sha }}
            docker compose -f docker-compose-dev.yml up -d
          "

  # -----------------------------------
  # 3) PROD 배포
  # -----------------------------------
  deploy_prod_job:
    runs-on: ubuntu-latest
    needs: ci_job
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: packaged-jar
          path: build/libs

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set env
        run: |
          echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILDTIME=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Build & Push Prod Image
        run: |
          docker build -t climingo/climingo:${{ github.sha }} .
          docker push climingo/climingo:${{ github.sha }}

      - uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Deploy to Production Server
        run: |
          ssh -o StrictHostKeyChecking=no singco@${{ secrets.PROD_HOST }} "
            set -e
            export PATH='/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin':\$PATH
            cd '${{ secrets.PROD_DOCKER_COMPOSE_PATH }}'
            export TAG='${{ github.sha }}'
            export JASYPT_PASSWORD='${{ secrets.JASYPT_PASSWORD }}'
            export BUILDTIME='$BUILDTIME'
            docker pull climingo/climingo:${{ github.sha }}
            docker compose -f docker-compose.yml up -d
          "
