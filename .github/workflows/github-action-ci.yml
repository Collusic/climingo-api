name: CI/CD Pipeline

on:
  push:
    branches:
      - dev            # dev push → CI + dev CD
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main           # main PR: opened/sync = CI, closed+merged = prod CD

jobs:

  # -----------------------------------
  # 1) CI (빌드 + 테스트)
  # -----------------------------------
  ci_job:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request')
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Test with Gradle
        run: ./gradlew test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packaged-jar
          path: build/libs/*.jar


  # -----------------------------------
  # 2) 개발 환경 CD (dev push 시)
  # -----------------------------------
  deploy_dev_job:
    needs: ci_job
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: packaged-jar
          path: build/libs

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set TAG
        run: echo "TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Set build time (KST)
        run: echo "BUILDTIME=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Build & Push Dev Docker Image
        run: |
          docker build -t climingo/climingo-dev:$TAG .
          docker push climingo/climingo-dev:$TAG

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Deploy to Dev Server
        run: |
          ssh -o StrictHostKeyChecking=no singco@${{ secrets.DEV_HOST }} \
            "cd '${{ secrets.DEV_DOCKER_COMPOSE_PATH }}' && \
             TAG='${{ github.sha }}' \
             JASYPT_PASSWORD='${{ secrets.JASYPT_PASSWORD }}' \
             BUILDTIME='$env.BUILDTIME' \
             docker pull climingo/climingo-dev:'${{ github.sha }}' && \
             docker compose -f docker-compose-dev.yml up -d"

  # -----------------------------------
  # 3) 운영 환경 CD (main PR merge 시)
  # -----------------------------------
  deploy_prod_job:
    runs-on: ubuntu-latest
    needs: ci_job
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: packaged-jar
          path: build/libs

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set TAG
        run: echo "TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Set build time (KST)
        run: echo "BUILDTIME=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Build & Push Prod Docker Image
        run: |
          docker build -t climingo/climingo:$TAG .
          docker push climingo/climingo:$TAG

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Deploy to Production Server
        run: |
          ssh -o StrictHostKeyChecking=no singco@${{ secrets.PROD_HOST }} \
            "cd '${{ secrets.PROD_DOCKER_COMPOSE_PATH }}' && \
             TAG='${{ github.sha }}' \
             JASYPT_PASSWORD='${{ secrets.JASYPT_PASSWORD }}' \
             BUILDTIME='$env.BUILDTIME' \
             docker pull climingo/climingo-dev:'${{ github.sha }}' && \
             docker compose -f docker-compose-dev.yml up -d"
          EOF
